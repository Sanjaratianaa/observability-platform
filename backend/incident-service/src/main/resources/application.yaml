spring:
  application:
    name: incident-service
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${SPRING_ELASTICSEARCH_USERNAME:}
    password: ${SPRING_ELASTICSEARCH_PASSWORD:}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:obsdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: incident-service

notification:
  teams:
    webhook-url: ${TEAMS_WEBHOOK_URL:https://placeholder.webhook.office.com/not-configured}
  jira:
    base-url: ${JIRA_BASE_URL:https://not-configured}
    email: ${JIRA_EMAIL:not-configured}
    api-token: ${JIRA_API_TOKEN:not-configured}
    project-key: ${JIRA_PROJECT_KEY:OPS}
