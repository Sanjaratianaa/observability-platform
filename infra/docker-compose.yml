services:
  # --- Elasticsearch ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: obs-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- PostgreSQL (metadata) ---
  postgres:
    image: postgres:16-alpine
    container_name: obs-postgres
    environment:
      - POSTGRES_DB=observability
      - POSTGRES_USER=obsuser
      - POSTGRES_PASSWORD=obspass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsuser -d observability"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Monitoring service (ingestion, parsing, détection) ---
  monitoring-service:
    build:
      context: ../backend
      dockerfile: monitoring-service/Dockerfile
    container_name: obs-monitoring
    environment:
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_ELASTICSEARCH_USERNAME=
      - SPRING_ELASTICSEARCH_PASSWORD=
      - INCIDENT_SERVICE_URL=http://incident-service:8082
      - SERVER_PORT=8081
    ports:
      - "8081:8081"
    depends_on:
      elasticsearch:
        condition: service_healthy
      incident-service:
        condition: service_started

  # --- Incident service (corrélation, déduplication, Jira/Teams, audit) ---
  incident-service:
    build:
      context: ../backend
      dockerfile: incident-service/Dockerfile
    container_name: obs-incident
    environment:
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_ELASTICSEARCH_USERNAME=
      - SPRING_ELASTICSEARCH_PASSWORD=
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/observability
      - SPRING_DATASOURCE_USERNAME=obsuser
      - SPRING_DATASOURCE_PASSWORD=obspass
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - H2_CONSOLE_ENABLED=false
      - SERVER_PORT=8082
    ports:
      - "8082:8082"
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # --- ChatOps service (interface conversationnelle) ---
  chatops-service:
    build:
      context: ../backend
      dockerfile: chatops-service/Dockerfile
    container_name: obs-chatops
    environment:
      - INCIDENT_SERVICE_URL=http://incident-service:8082
      - SERVER_PORT=8083
    ports:
      - "8083:8083"
    depends_on:
      - incident-service

  # --- Frontend React (nginx) ---
  frontend:
    build:
      context: ../frontend/dashboard
      dockerfile: Dockerfile
    container_name: obs-frontend
    ports:
      - "8090:80"
    depends_on:
      - monitoring-service
      - incident-service
      - chatops-service

  # --- Prometheus (métriques) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: obs-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    depends_on:
      - monitoring-service
      - incident-service
      - chatops-service

  # --- Grafana (visualisation métriques) ---
  grafana:
    image: grafana/grafana:latest
    container_name: obs-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  esdata:
    driver: local
  pgdata:
    driver: local
  grafanadata:
    driver: local